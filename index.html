<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1411">
<title>Флорариум · Комбинатор</title>
<link rel="icon" href="img/logo_florarium.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="aurora a1"></div><div class="aurora a2"></div><div class="aurora a3"></div>
  <div class="grain"></div>
</div>

<header class="nav" id="nav">
  <a class="brand" href="#" data-view-link="builder">
    <img src="img/logo_florarium.svg" alt="" class="brand-logo">
    <span class="brand-name" data-i18n="app.title"></span>
  </a>
  <nav class="nav-links" id="navLinks" aria-label="Разделы"></nav>
  <div class="nav-right">
    <button class="lang-switch" id="langBtn" type="button" aria-label="Language">RU</button>
  </div>
</header>

<main id="main">
  <!-- LOADING -->
  <section class="boot" id="boot">
    <div class="boot-orb"></div>
    <p data-i18n="state.loading"></p>
  </section>

  <!-- ERROR -->
  <section class="boot hidden" id="bootError">
    <div class="err-dot"></div>
    <h2 data-i18n="state.error_title"></h2>
    <p data-i18n="state.error_body"></p>
    <button class="btn primary" id="retryBtn" type="button" data-i18n="btn.retry"></button>
  </section>

  <!-- BUILDER -->
  <section class="view hidden" id="view-builder">
    <div class="builder-grid">
      <aside class="panel config" id="configPanel" aria-label="Параметры"></aside>
      <section class="panel catalog" aria-label="Каталог">
        <div class="catalog-head">
          <div class="tabs" id="catalogTabs"></div>
          <div class="search inset">
            <svg viewBox="0 0 24 24" class="ic"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="searchInput" type="search" autocomplete="off">
          </div>
          <select id="sortSelect" class="select" aria-label="Sort"></select>
        </div>
        <div class="chips" id="groupChips"></div>
        <div class="cards" id="catalogCards"></div>
      </section>
      <aside class="panel jar" id="jarPanel" aria-label="Сборка"></aside>
    </div>
  </section>

  <!-- CARE -->
  <section class="view hidden" id="view-care">
    <div class="view-head"><h1 data-i18n="nav.care"></h1><p class="sub" id="careSub"></p></div>
    <div id="careContent" class="care-grid"></div>
  </section>

  <!-- DIAGNOSTICS -->
  <section class="view hidden" id="view-diag">
    <div class="view-head"><h1 data-i18n="nav.diag"></h1><p class="sub" id="diagSub"></p></div>
    <div id="diagContent" class="diag-list"></div>
  </section>

  <!-- SAVED -->
  <section class="view hidden" id="view-saved">
    <div class="view-head">
      <h1 data-i18n="saved.title"></h1>
      <div class="head-actions">
        <button class="btn ghost" id="exportBtn" type="button" data-i18n="btn.export"></button>
        <label class="btn ghost file-label"><span data-i18n="btn.import"></span><input type="file" id="importFile" accept="application/json" hidden></label>
      </div>
    </div>
    <div id="savedContent" class="saved-grid"></div>
  </section>
</main>

<!-- SPECIES DRAWER -->
<div class="scrim hidden" id="drawerScrim"></div>
<aside class="drawer hidden" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
  <button class="icon-btn drawer-close" id="drawerClose" type="button" aria-label="Close">
    <svg viewBox="0 0 24 24" class="ic"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div id="drawerBody"></div>
</aside>

<!-- SAVE MODAL -->
<div class="scrim hidden" id="saveScrim"></div>
<div class="modal hidden" id="saveModal" role="dialog" aria-modal="true">
  <h2 data-i18n="btn.save"></h2>
  <label class="field"><span data-i18n="saved.name_label"></span>
    <input id="saveName" class="input" type="text" maxlength="60">
  </label>
  <div class="modal-actions">
    <button class="btn ghost" id="saveCancel" type="button" data-i18n="btn.back"></button>
    <button class="btn primary" id="saveConfirm" type="button" data-i18n="btn.save"></button>
  </div>
</div>

<!-- AI MODAL -->
<div class="scrim hidden" id="aiScrim"></div>
<div class="modal hidden" id="aiModal" role="dialog" aria-modal="true">
  <h2 data-i18n="ai.button"></h2>
  <p class="sub" id="aiHint"></p>
  <textarea id="aiPrompt" class="textarea" readonly></textarea>
  <div class="ai-targets" id="aiTargets"></div>
  <div class="modal-actions">
    <button class="btn ghost" id="aiClose" type="button" data-i18n="btn.back"></button>
    <button class="btn primary" id="aiCopy" type="button" data-i18n="ai.target_copy"></button>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="mobile-bar hidden" id="mobileBar"></div>

<script src="app.js"></script>
</body>
</html>
