<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF7F2">
<title>Флорариум · Комбинатор</title>
<link rel="icon" href="img/logo_florarium.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-tab="build">
<div class="bg" aria-hidden="true"><span class="aurora a1"></span><span class="aurora a2"></span><span class="aurora a3"></span><span class="veins"></span></div>

<header class="topbar">
  <a class="brand" href="#" data-go="build">
    <img src="img/logo_florarium.svg" alt="" class="brand-logo">
    <span class="brand-text"><b data-i18n="app.title">Флорариум</b><i data-i18n="app.tagline">Собери экосистему, которая выживет</i></span>
  </a>
  <nav class="tabnav" id="tabnav" aria-label="Разделы"></nav>
  <div class="topbar-tools">
    <button class="tool" id="themeBtn" type="button" aria-label="Тема"></button>
    <button class="tool lang" id="langBtn" type="button" aria-label="Language">RU</button>
  </div>
</header>

<main class="shell" id="shell">
  <div class="workspace">
    <section class="boot" id="boot"><span class="boot-orb"></span><p data-i18n="state.loading">Загружаем каталог…</p></section>
    <section class="boot hidden" id="bootError"><span class="err-dot"></span><h2>Не удалось запустить</h2><p id="bootErrorMsg"></p><button class="btn primary" id="retryBtn" type="button">Повторить</button></section>

    <section class="pane hidden" id="pane-build">
      <div class="build-top">
        <div class="pv-card"><div class="pv-frame" data-pv="lg"></div><div class="pv-meta" id="pvMeta"></div></div>
        <div class="verdict-card" id="verdictCard"></div>
      </div>
      <div class="subtabs" id="buildSubtabs" role="tablist"></div>
      <div class="pane-body" id="buildBody"></div>
    </section>

    <section class="pane hidden" id="pane-plants">
      <div class="pane-head"><h1 data-i18n="step.plants">Растения</h1><p class="sub" id="plantsCount"></p></div>
      <div class="toolbar" id="plantsToolbar"></div>
      <div class="chips" id="plantsChips"></div>
      <div class="grid" id="plantsGrid"></div>
    </section>

    <section class="pane hidden" id="pane-fauna">
      <div class="pane-head"><h1 data-i18n="step.fauna">Живность</h1><p class="sub" id="faunaCount"></p></div>
      <div class="toolbar" id="faunaToolbar"></div>
      <div class="chips" id="faunaChips"></div>
      <div class="grid" id="faunaGrid"></div>
    </section>

    <section class="pane hidden" id="pane-setup">
      <div class="pane-head"><h1 data-i18n="tab.setup">Условия</h1><p class="sub" data-i18n="setup.hint">Тара, система, место и материалы</p></div>
      <div class="setup-grid" id="setupBody"></div>
    </section>

    <section class="pane hidden" id="pane-care">
      <div class="pane-head"><h1 data-i18n="nav.care">Уход</h1><p class="sub" id="careSub"></p></div>
      <div class="subtabs" id="careSubtabs" role="tablist"></div>
      <div class="pane-body" id="careBody"></div>
    </section>
  </div>

  <aside class="rail" id="rail" aria-label="Сборка">
    <div class="rail-inner">
      <div class="pv-frame sm" data-pv="sm"></div>
      <div id="railBody"></div>
    </div>
  </aside>
</main>

<button class="statusstrip hidden" id="statusStrip" type="button" data-go="build"></button>
<nav class="tabbar" id="tabbar" aria-label="Разделы"></nav>

<div class="scrim hidden" id="scrim"></div>
<aside class="sheet hidden" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <span class="sheet-grip"></span>
  <button class="icon-btn sheet-close" id="sheetClose" type="button" aria-label="Закрыть"><svg viewBox="0 0 24 24" class="ic"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div id="sheetBody"></div>
</aside>

<div class="modal hidden" id="saveModal" role="dialog" aria-modal="true">
  <h2 data-i18n="btn.save">Сохранить сборку</h2>
  <label class="field"><span data-i18n="saved.name_label">Название сборки</span><input id="saveName" class="input" type="text" maxlength="60"></label>
  <div class="modal-actions"><button class="btn ghost" data-close="saveModal" type="button">Отмена</button><button class="btn primary" id="saveConfirm" type="button" data-i18n="btn.save">Сохранить</button></div>
</div>

<div class="modal hidden" id="aiModal" role="dialog" aria-modal="true">
  <h2 data-i18n="ai.button">Проверить сборку у ИИ</h2>
  <p class="sub" data-i18n="ai.hint">Текст скопируется в буфер — вставьте его в чат, если не подставится сам.</p>
  <textarea id="aiPrompt" class="textarea" readonly></textarea>
  <div class="ai-targets" id="aiTargets"></div>
  <div class="modal-actions"><button class="btn ghost" data-close="aiModal" type="button">Закрыть</button><button class="btn primary" id="aiCopy" type="button" data-i18n="ai.target_copy">Скопировать</button></div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>
(function(){
  window.__florReady=false;
  window.__florFail=function(m){var b=document.getElementById('boot'),e=document.getElementById('bootError'),t=document.getElementById('bootErrorMsg');if(b)b.classList.add('hidden');if(e)e.classList.remove('hidden');if(t)t.textContent=m;};
  window.addEventListener('error',function(ev){if(!window.__florReady)window.__florFail('Ошибка JS: '+(ev.message||'?')+' ('+(ev.filename||'').split('/').pop()+':'+(ev.lineno||'?')+'). Консоль: F12.');});
  setTimeout(function(){if(!window.__florReady)window.__florFail('app.js не запустился. Скопируйте файл целиком — последняя строка boot(); — и обновите страницу (Ctrl+F5).');},9000);
  document.addEventListener('click',function(e){if(e.target&&e.target.id==='retryBtn')location.reload();});
})();
</script>
<script src="app.js"></script>
<script src="preview.js"></script>
</body>
</html>
